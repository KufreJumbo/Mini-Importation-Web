<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Product · Chi-Best</title>
  <meta name="description" content="Imported from China and delivered across Nigeria by Chi-Best.">
  <meta name="theme-color" content="#121418">
  <link rel="icon" type="image/png" href="images/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400..800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/fontawesome.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/brands.min.css">
  <link rel="stylesheet" href="css/store.css">
</head>
<body>
  <div id="app-header"></div>

  <main id="main" class="page-sections">
    <div class="container">
      <div class="page-head" style="padding-bottom:0"><nav class="crumbs" aria-label="Breadcrumb" data-crumbs></nav></div>
      <div data-product>
        <div class="pdp" aria-hidden="true">
          <div class="skeleton" style="aspect-ratio:1;border-radius:26px"></div>
          <div style="display:grid;gap:16px;align-content:start"><div class="skeleton" style="height:18px;width:30%"></div><div class="skeleton" style="height:40px;width:85%"></div><div class="skeleton" style="height:34px;width:40%"></div><div class="skeleton" style="height:70px"></div><div class="skeleton" style="height:54px"></div></div>
        </div>
      </div>
    </div>

    <section class="section tight" data-related-section hidden>
      <div class="container">
        <div class="section-head"><div><span class="eyebrow">More to love</span><h2>You may also <span class="serif">like</span></h2></div>
          <div class="rail-nav"><button class="icon-btn" data-rail="-1" aria-label="Scroll left"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><button class="icon-btn" data-rail="1" aria-label="Scroll right"><svg class="icon" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div>
        </div>
        <div class="rail" data-related></div>
      </div>
    </section>

    <section class="section tight" data-recent-section hidden>
      <div class="container">
        <div class="section-head"><div><h2>Recently <span class="serif">viewed</span></h2></div></div>
        <div class="rail" data-recent></div>
      </div>
    </section>
  </main>

  <div class="sticky-buy" data-sticky-buy></div>
  <div id="app-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/product.js"></script>
</body>
</html>
