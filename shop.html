<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shop · Chi-Best</title>
  <meta name="description" content="Browse kids' fashion, shoes, bags, beauty, home and gadgets imported from China. Ready stock in Lagos and pre-orders delivered across Nigeria.">
  <meta name="theme-color" content="#121418">
  <link rel="icon" type="image/png" href="images/brand/favicon-64.png">
  <link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400..800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/fontawesome.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/brands.min.css">
  <link rel="stylesheet" href="css/store.css">
</head>
<body>
  <div id="app-header"></div>

  <main id="main">
    <div class="container">
      <div class="page-head">
        <nav class="crumbs" aria-label="Breadcrumb" data-crumbs></nav>
        <h1 class="page-title" data-title>Shop all</h1>
        <p class="page-sub" data-sub></p>
        <div class="chip-row" data-chips></div>
      </div>

      <div class="shop-layout">
        <aside class="filters" aria-label="Filters" data-filters></aside>
        <section aria-label="Products">
          <div class="toolbar">
            <span class="toolbar-count" data-count aria-live="polite"></span>
            <div class="toolbar-right">
              <button class="filter-btn" type="button" data-open-filters></button>
              <label class="sr-only" for="sort">Sort by</label>
              <select class="select" id="sort" data-sort>
                <option value="featured">Sort: Featured</option>
                <option value="newest">Newest first</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
                <option value="discount">Biggest discount</option>
                <option value="name">Name: A to Z</option>
              </select>
            </div>
          </div>
          <div class="active-filters" data-active></div>
          <div class="grid-products cols-3" data-grid></div>
          <div class="load-more" data-more></div>
        </section>
      </div>
    </div>
  </main>

  <aside class="drawer bottom" id="filter-drawer" aria-label="Filters" aria-hidden="true">
    <div class="drawer-head"><h3>Filters</h3><button class="icon-btn" type="button" data-close aria-label="Close filters"></button></div>
    <div class="drawer-body" style="padding:8px 22px 20px" data-filters-mobile></div>
    <div class="drawer-foot" style="display:flex;gap:10px">
      <button class="btn btn-outline" type="button" data-clear-all style="flex:1">Clear all</button>
      <button class="btn btn-dark" type="button" data-close style="flex:2" data-show-results>Show results</button>
    </div>
  </aside>

  <div id="app-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/shop.js"></script>
</body>
</html>
